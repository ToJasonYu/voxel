services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: voxel
      POSTGRES_USER: voxel
      POSTGRES_PASSWORD: voxel
    ports:
      # Host side is 5433 (not the default 5432) to avoid clashing with a
      # locally-installed Postgres; the backend container still talks to this
      # service over the internal Docker network on the standard 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Postgres runs every .sql file in here (alphabetically) on first init only --
      # if the volume already has data, this is skipped, so re-running compose won't re-seed.
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxel -d voxel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: voxel
      DB_USER: voxel
      DB_PASSWORD: voxel
      READONLY_DB_USER: voxel_readonly
      READONLY_DB_PASSWORD: voxel_readonly
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
