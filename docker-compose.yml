services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: voxel
      POSTGRES_USER: voxel
      POSTGRES_PASSWORD: voxel
    ports:
      # Host side is 5433 (not the default 5432) to avoid clashing with a
      # locally-installed Postgres; the backend container still talks to this
      # service over the internal Docker network on the standard 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Postgres runs every .sql file in here (alphabetically) on first init only --
      # if the volume already has data, this is skipped, so re-running compose won't re-seed.
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxel -d voxel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: voxel
      DB_USER: voxel
      DB_PASSWORD: voxel
      READONLY_DB_USER: voxel_readonly
      READONLY_DB_PASSWORD: voxel_readonly
      # Pulled from the host's own environment -- never hardcoded here. Set it
      # before running `docker compose up`, e.g. `export ANTHROPIC_API_KEY=sk-...`.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Only needed for orgs using workspace-scoped API keys -- see README.
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Host-reachable addresses (see frontend/Dockerfile) -- match the
        # backend's host port mapping above.
        VITE_GRAPHQL_HTTP_URL: http://localhost:8080/graphql
        VITE_GRAPHQL_WS_URL: ws://localhost:8080/subscriptions
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
