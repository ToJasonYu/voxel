services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: voxel
      POSTGRES_USER: voxel
      POSTGRES_PASSWORD: voxel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxel -d voxel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: voxel
      DB_USER: voxel
      DB_PASSWORD: voxel
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
